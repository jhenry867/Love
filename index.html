// JPEG no tiene transparencia: quita el blanco conectado a los bordes, sin tocar el blanco interno
function cutout(src, cb){
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, W = c.width, H = c.height;
    const seen = new Uint8Array(W*H), st = [];
    const cr = [0, 0, 0];
    [0, W-1, (H-1)*W, H*W-1].forEach(q => { for (let k = 0; k < 3; k++) cr[k] += p[q*4+k] / 4; });
    const white = q => Math.abs(p[q*4]-cr[0]) + Math.abs(p[q*4+1]-cr[1]) + Math.abs(p[q*4+2]-cr[2]) < 90;
    for (let i = 0; i < W; i++) st.push(i, (H-1)*W + i);
    for (let j = 0; j < H; j++) st.push(j*W, j*W + W-1);
    while (st.length) {
      const q = st.pop();
      if (seen[q] || !white(q)) continue;
      seen[q] = 1; p[q*4+3] = 0;
      const xq = q % W;
      if (xq > 0) st.push(q-1); if (xq < W-1) st.push(q+1);
      if (q >= W) st.push(q-W); if (q < W*(H-1)) st.push(q+W);
    }
    x.putImageData(d, 0, 0); cb(c.toDataURL());
  };
  im.onerror = () => cb(null);
  im.src = src;
}

function synth(){ // melodía de respaldo: pads en Am–F–C–G a 72 BPM aprox.
  const C = [[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
  const o = [0,1,2].map(() => { const v = ac.createOscillator(), g = ac.createGain(); v.type = 'sine'; g.gain.value = .22; v.connect(g).connect(master); v.start(); return v; });

  step(); setInterval(step, 3300);
}
function chime(){
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.value = 880; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.9);
  o.connect(g).connect(master); o.start(t); o.stop(t+1);
}
function whoosh(){
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(), t = ac.currentTime;
  f.type = 'lowpass'; f.frequency.value = 800; o.type = 'triangle';
  o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(900,t+1.3); o.frequency.exponentialRampToValueAtTime(120,t+2.6);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.06,t+1.2); g.gain.linearRampToValueAtTime(0,t+2.6);

}

function buildScene(){
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  $('scene').appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 400);
  camera.position.set(0,22,46); camera.lookAt(0,0,0);

  controls = new OC.OrbitControls(camera, renderer.domElement);
  Object.assign(controls, { enableDamping: true, dampingFactor: .06, autoRotate: true, autoRotateSpeed: .3, enablePan: false, minDistance: 14, maxDistance: 90 });

  composer = new EC.EffectComposer(renderer);

  // estrellas de fondo
  const sp = new Float32Array(1800*3);
  for (let i = 0; i < 1800; i++) { const r = 120+Math.random()*60, a = Math.random()*6.283, b = Math.acos(2*Math.random()-1); sp.set([r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a)], i*3); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xe9d6f0, size: .5, transparent: true, opacity: .6, depthWrite: false })));

  // universo: escala 0→1 en la revelación
  U = new THREE.Group(); U.scale.setScalar(.001); scene.add(U);

  // galaxia espiral (~12 000 pts)
  const N = 12000, gp = new Float32Array(N*3), gc = new Float32Array(N*3), cA = new THREE.Color('#ffe2b8'), cB = new THREE.Color('#c2557f'), cC = new THREE.Color('#5b3a8e'), tmp = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const r = Math.pow(Math.random(),.7)*30+1.5, arm = i % 3;
    const a = arm*2.094 + r*.2 + (Math.random()-.5)*.5*(1+r/30);
    gp.set([Math.cos(a)*r, (Math.random()-.5)*(1.4-r*.03), Math.sin(a)*r], i*3);
    const t = r/31; if (t < .35) tmp.lerpColors(cA, cB, t/.35); else tmp.lerpColors(cB, cC, (t-.35)/.65);
    gc.set([tmp.r,tmp.g,tmp.b], i*3);
  }
  const gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.BufferAttribute(gp,3)); gg.setAttribute('color', new THREE.BufferAttribute(gc,3));
  galaxy = new THREE.Points(gg, new THREE.PointsMaterial({ size: .34, vertexColors: true, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }));
  U.add(galaxy);

  // agujero negro + anillo + halo
  bh = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  bh.userData.letters = true; U.add(bh);
  ringM = new THREE.Mesh(new THREE.RingGeometry(2.7,4.6,96), new THREE.MeshBasicMaterial({ color: 0xe8c37a, transparent: true, opacity: .3, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  ringM.rotation.x = Math.PI/2; U.add(ringM);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(3.4,24,24), new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: .08, blending: THREE.AdditiveBlending, depthWrite: false }));
  U.add(halo); U.userData.halo = halo;

  // corazón de partículas (~2400) con jet desde el agujero negro
  heartG = new THREE.Group(); heartG.position.y = 7; U.add(heartG);
  const hp = new Float32Array(2400*3);
  for (let i = 0; i < 2400; i++) {
    const t = Math.random()*6.283;
    const x = 16*Math.pow(Math.sin(t),3), y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const s = i < 1400 ? 1 : Math.sqrt(Math.random())*.95;
    hp.set([x*s*.2, y*s*.2, (Math.random()-.5)*1.5], i*3);
  }
  const hg = new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.BufferAttribute(hp,3));
  heartPts = new THREE.Points(hg, new THREE.PointsMaterial({ color: 0xf472b6, size: .16, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
  heartG.add(heartPts);
  hitHeart = new THREE.Mesh(new THREE.SphereGeometry(4,16,16), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hitHeart.userData.letters = true; heartG.add(hitHeart);

  jetPos = new Float32Array(300*3);
  for (let j = 0; j < 300; j++) jetPos.set([(Math.random()-.5)*.6, Math.random()*6, (Math.random()-.5)*.6], j*3);
  const jg = new THREE.BufferGeometry(); jg.setAttribute('position', new THREE.BufferAttribute(jetPos,3));
  jet = new THREE.Points(jg, new THREE.PointsMaterial({ color: 0xf9a8d4, size: .18, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false }));
  U.add(jet);

  // stickers orbitando (16): imagen del repo o dibujo propio
  const TL = new THREE.TextureLoader();
  for (let i = 0; i < 16; i++) {
    const mat = new THREE.SpriteMaterial({ color: new THREE.Color(.5, .5, .5), transparent: true, opacity: 0, depthWrite: false });
    STK_MATS.push(mat);
    const s = new THREE.Sprite(mat);
    s.userData = { msg: i, r: 12 + (i%4)*4 + Math.random()*2, h: (Math.random()-.5)*8, sp: .08+Math.random()*.1, ph: i*(6.283/16)+Math.random()*.4, k: 1, hv: false };
    U.add(s); stickers.push(s);
  }
  // 12 frases flotantes
  PHRASES.forEach((txt, i) => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
    x.font = '34px ui-monospace, Menlo, monospace'; x.textAlign = 'center'; x.fillStyle = i % 2 ? '#e8c37a' : '#f9a8d4';
    x.shadowColor = x.fillStyle; x.shadowBlur = 10; x.fillText(txt, 256, 72);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: .75, depthWrite: false }));
    s.scale.set(9, 2.25, 1);
    s.userData = { r: 17 + Math.random()*10, h: (Math.random()-.5)*10, sp: .05+Math.random()*.04, ph: i*.52 };
    U.add(s); phrases.push(s);
  });

  // escena de warp (líneas aditivas)
  const WN = 400; warpP = new Float32Array(WN*6); warpZ = new Float32Array(WN);
  for (let i = 0; i < WN; i++) {
    const a = Math.random()*6.283, r = 6+Math.random()*24, x = Math.cos(a)*r, y = Math.sin(a)*r+6, z = -60+Math.random()*100;
    warpZ[i] = z; warpP.set([x,y,z,x,y,z], i*6);
  }
  const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.BufferAttribute(warpP,3));
  warp = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0xf4c2dc, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  warp.visible = false; scene.add(warp);
  applyCuts();
}

/* ---------- interacción ---------- */
function targets(){ return [...stickers, hitHeart, bh]; }
function hit(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(targets(), false)[0]?.object || null;
}
function anyModalOpen(){ return !!document.querySelector('.modal.on'); }

function openModal(id){ $(id).classList.add('on'); chime(); }
function closeModals(){ document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); }
function openMsg(i){
  $('msgTxt').textContent = MSGS[i];
  $('msgImg').src = STICKER_URLS[i % 2];
  openModal('msg');
}
let li = 0;
function showLetter(n){
  li = (n + 3) % 3;
  $('letTxt').innerHTML = LETTERS[li].map(t => `<p>${t}</p>`).join('');
  $('dots').innerHTML = LETTERS.map((_, k) => `<i class="${k===li?'on':''}"></i>`).join('');
}
function openLetters(){ showLetter(0); openModal('let'); }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
  if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('on');
}));
$('prev').onclick = () => showLetter(li-1);
$('next').onclick = () => showLetter(li+1);
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModals();
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); setMuted(!muted); }
  if (e.target.id === 'let' || $('let').classList.contains('on')) { if (e.key === 'ArrowLeft') showLetter(li-1); if (e.key === 'ArrowRight') showLetter(li+1); }
});
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});

/* ---------- secuencia: entrada → warp → revelación ---------- */
function showUI(){
  $('head').style.opacity = 1;
  const h = $('help'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 10000);
}
function enter(){
  if (stage !== 'entry') return;
  ensureAC(); audio.play().catch(() => {});
  setTimeout(() => { if (!hasMusic) synth(); }, 1500);
  $('entry').style.opacity = 0; setTimeout(() => $('entry').style.display = 'none', 1000);
  if (!hasGL) { stage = 'light'; $('scene').style.display = 'none'; $('vig').style.display = 'none'; buildLight(); showUI(); return; }
  stage = 'warp'; warpT = 0; warp.visible = true; whoosh(); showUI();
}
$('go').onclick = enter;

function buildLight(){
  const L = $('light'); L.style.display = 'flex';
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('button'); b.textContent = String(i + 1);
    b.onclick = () => openMsg(i); L.appendChild(b);
  }
  const h = document.createElement('button'); h.textContent = '❤ cartas'; h.onclick = openLetters; L.appendChild(h);
}

/* ---------- bucle principal (un solo rAF) ---------- */
let hoverNow = null;
if (hasGL) {
  buildScene();
  const clock = new (THREE.Clock)();
  const cv = renderer.domElement;
  let down = null;
  cv.addEventListener('pointerdown', e => down = { x: e.clientX, y: e.clientY });
  cv.addEventListener('pointerup', e => {
    if (!down || stage !== 'live' || anyModalOpen()) return;
    if (Math.hypot(e.clientX-down.x, e.clientY-down.y) < 8) {
      const o = hit(e); const u = o?.userData;
      if (u && u.msg !== undefined) openMsg(u.msg); else if (u && u.letters) openLetters();
    }
    down = null;
  });
  cv.addEventListener('pointermove', e => {
    if (stage !== 'live' || anyModalOpen()) return;
    const o = hit(e); hoverNow = o;
    cv.style.cursor = o ? 'pointer' : 'grab';
    stickers.forEach(s => s.userData.hv = (s === o));
    hoverTarget = o === hitHeart || o === bh ? 1 : 0;
  });
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  });

  const ease = k => 1 - Math.pow(1-Math.min(Math.max(k,0),1), 3);
  const WARP = 2.6;
  (function loop(){
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), .05); now += dt;
    if (stage === 'warp') {
      warpT += dt; const k = Math.min(warpT/WARP, 1), sp = 1.5 + 90*Math.pow(Math.sin(Math.PI*k),2);
      const len = .5 + sp*.012, pa = warp.geometry.attributes.position.array;
      for (let i = 0; i < warpZ.length; i++) {
        let z = warpZ[i] += sp*dt; if (z > 40) { z = warpZ[i] = -60; }
        pa[i*6+2] = z; pa[i*6+5] = z - len;
      }
      warp.geometry.attributes.position.needsUpdate = true;
      warp.material.opacity = Math.min(1, k*4) * (1 - Math.max(0,(k-.8)*5));
      camera.fov = 55 + 26*Math.sin(Math.PI*k); camera.updateProjectionMatrix();
      if (warpT >= WARP) {
        stage = 'reveal'; revealT = 0; warp.visible = false; camera.fov = 55; camera.updateProjectionMatrix();
      }
    }
    if (stage === 'reveal') {
      revealT += dt; const e = ease(revealT/2.2);
      U.scale.setScalar(Math.max(.001, e)); heartG.position.y = 7*e;
      if (revealT >= 2.2) stage = 'live';
    }
    if (stage === 'live' || stage === 'reveal') {
      const beat = Math.pow(Math.max(0, Math.sin(now*2*Math.PI*1.2)), 8); // 72 BPM
      galaxy.rotation.y += dt*.03;
      U.userData.halo.scale.setScalar(1 + .12*beat);
      hoverH += (hoverTarget - hoverH) * .15;
      heartG.scale.setScalar(1 + .07*beat + .08*hoverH);
      for (let j = 0; j < 300; j++) {
        let y = jetPos[j*3+1] + dt*(2.5+Math.random()*1.5);
        if (y > 6) { y = 0.5; } jetPos[j*3+1] = y;
        jetPos[j*3] *= 1 - dt*.2; jetPos[j*3+2] *= 1 - dt*.2;
      }
      jet.geometry.attributes.position.needsUpdate = true;
      for (const s of stickers) {
        const u = s.userData, a = u.ph + now*u.sp;
        s.position.set(Math.cos(a)*u.r, u.h + Math.sin(now*.9+u.ph)*1.2, Math.sin(a)*u.r);
        u.k += ((u.hv ? 1.17 : 1) - u.k) * .2;
        s.scale.setScalar(4.4*(1+.04*beat)*u.k);
      }
      for (const s of phrases) {
        const u = s.userData, a = u.ph + now*u.sp;
        s.position.set(Math.cos(a)*u.r, u.h + Math.sin(now*.5+u.ph), Math.sin(a)*u.r);
      }
      controls.update();
    } else { controls.update(); }
    composer.render();
  })();
}
// modo ligero: nada que animar en 3D; la música y los mensajes siguen funcionando
</script>
